name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20.19, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Packages and Pages candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:targets
      - run: npm run test:packages
      - run: npm run verify
      - name: Verify Pages artifact
        run: node scripts/verify-pages-artifact.mjs

  browser:
    name: Browser acceptance · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  angular_material:
    name: Angular Material v22 · AOT and Sass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/targets/angular-material/package-lock.json
      - run: npm ci
      - run: npm ci --prefix test/targets/angular-material
      - run: npm run build -w @s9rg/theme-compiler
      - run: npm run build -w @s9rg/theme-adapter-angular-material
      - run: npm run test:target:angular-material

  react_native_paper:
    name: React Native Paper v5 · Metro iOS and Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @s9rg/theme-compiler
      - run: npm run build -w @s9rg/theme-adapter-react-native-paper
      - run: npm run test:target:react-native-paper

  required:
    name: CI required
    if: always()
    needs: [static, unit, build, browser, angular_material, react_native_paper]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node -e 'const needs=JSON.parse(process.env.NEEDS_JSON); const failed=Object.entries(needs).filter(([,job])=>job.result!=="success"); if(failed.length){console.error(failed); process.exit(1)}'
